[project]
name = "engine-dev-llm"
version = "0.1.0"
description = "Fine-tune an LLM on chess-engine-dev Discord chats to simulate the community."
requires-python = ">=3.11,<3.13"
dependencies = [
    # transformers 5.x is required for Qwen3.6 (Qwen3_5ForConditionalGeneration
    # / AutoModelForMultimodalLM). trl 1.x for the SFTConfig API used in train.py.
    "transformers>=5.0",
    "datasets>=3.2",
    "peft>=0.17",
    "trl>=1.0",
    "accelerate>=1.3",
    "bitsandbytes>=0.45",
    "dataclasses-json>=0.6",
    "tqdm>=4.66",
]

[dependency-groups]
# Installed by default with `uv sync` / `uv run`. Enables `uv run pyright`
# (pyrightconfig.json points at .venv).
dev = ["pyright>=1.1.390"]

[project.optional-dependencies]
# PyTorch backend — pick exactly one:
#   uv sync --extra cpu    → CPU (works everywhere)
#   uv sync --extra cuda   → CUDA 13.0 (NVIDIA GPUs, e.g. the H100)
#   uv sync --extra rocm   → ROCm 7.2  (AMD GPUs, Linux only)
cpu  = ["torch>=2.7"]
cuda = ["torch>=2.7"]
rocm = ["torch>=2.7", "triton-rocm"]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
    { extra = "rocm" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",  extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
