[project]
name = "engine-dev-llm"
version = "0.1.0"
description = "Fine-tune an LLM on chess-engine-dev Discord chats to simulate the community."
requires-python = ">=3.11,<3.14"
dependencies = [
    # transformers 5.x for Gemma 4 (gemma4_unified) and AutoModelForMultimodalLM;
    # trl >= 1.6 for loss_type="chunked_nll".
    "transformers>=5.12",
    "datasets>=3.2",
    "peft>=0.17",
    "trl>=1.6",
    "accelerate>=1.3",
    "bitsandbytes>=0.45",
    "numpy",
    "tqdm>=4.66",
    # The Gemma 4 processor (used by train.py) loads image/video processors that
    # need pillow + torchvision, even though we only ever feed text.
    "pillow>=10.0",
]

[dependency-groups]
# Installed by default with `uv sync` / `uv run`.
dev = ["pyright>=1.1.390", "ruff>=0.8"]

[project.optional-dependencies]
# PyTorch backend — pick exactly one (./run.sh detects it automatically):
#   uv sync --extra cpu    → CPU (works everywhere)
#   uv sync --extra cuda   → CUDA 13.0 (NVIDIA GPUs, e.g. the H100)
#   uv sync --extra rocm   → ROCm 7.2  (AMD GPUs, Linux only)
cpu  = ["torch>=2.7", "torchvision"]
cuda = ["torch>=2.7", "torchvision"]
rocm = ["torch>=2.7", "torchvision", "triton-rocm"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
    { extra = "rocm" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",  extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = [
  { index = "pytorch-cpu",  extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
